<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090c10">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="FinTerm – self-hosted finanční terminál (Bloomberg-style) pro Umbrel / Raspberry Pi">
<title>FinTerm</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090c10;--bg2:#0c1016;--card:#11161d;--card2:#151b24;--hover:#18202b;--line:#1d2530;--line2:#283241;
  --text:#e6edf3;--muted:#8b97a7;--dim:#5d6877;
  --accent:#2962ff;--accent2:#5c87ff;--accent-bg:rgba(41,98,255,.14);
  --amber:#f0a92e;--up:#1fbf75;--down:#f0444f;--up-bg:rgba(31,191,117,.13);--down-bg:rgba(240,68,79,.13);
  --info:#3fa7ff;--purple:#a371f7;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono","Roboto Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","DejaVu Sans",Arial,sans-serif;
  --r:6px;--gap:10px;--top:3.5rem;--tape:2.3rem;--status:1.85rem;--nav:4.9rem;
  --vh:calc(100dvh - var(--top) - var(--tape) - var(--status));
}
html{font-size:13px;background:var(--bg)}
@media (min-width:2000px){html{font-size:14px}}
@media (min-width:2560px){html{font-size:16px}}
@media (min-width:3400px){html{font-size:20px}}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:1rem;line-height:1.38;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#253041;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#33415a}
*{scrollbar-width:thin;scrollbar-color:#253041 transparent}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)!important}.dn{color:var(--down)!important}.fl{color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}.amber{color:var(--amber)}
.sp{flex:1}
.nowrap{white-space:nowrap}
.right{text-align:right}

/* ── top bar ── */
#topbar{height:var(--top);display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0;position:relative;z-index:30}
.brand{font-family:var(--mono);font-weight:800;letter-spacing:.1em;font-size:1.15rem;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;user-select:none}
.brand b{color:var(--accent2)}
.brand svg{width:1.7rem;height:1.7rem}
#cmdwrap{position:relative;flex:1;max-width:640px;min-width:160px;display:flex;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);height:2.3rem}
#cmdwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(41,98,255,.18)}
.cmd-p{color:var(--amber);font-family:var(--mono);padding:0 8px 0 10px;font-weight:800}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-family:var(--mono);font-size:.98rem;text-transform:uppercase;height:100%;letter-spacing:.03em}
#cmd::placeholder{text-transform:none;color:var(--dim);letter-spacing:0}
.go{background:var(--amber);color:#111;font-family:var(--mono);font-weight:800;font-size:.75rem;padding:3px 9px;border-radius:4px;margin-right:4px;cursor:pointer;border:0}
#cmd-dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 14px 40px rgba(0,0,0,.6);z-index:60;max-height:65vh;overflow:auto;display:none}
#cmd-dd.open{display:block}
.dd-h{padding:6px 10px 3px;font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.dd-i{display:flex;gap:10px;align-items:center;padding:6px 10px;cursor:pointer;font-size:.9rem}
.dd-i.sel,.dd-i:hover{background:var(--accent-bg)}
.dd-k{font-family:var(--mono);color:var(--amber);min-width:7rem;font-weight:700;white-space:nowrap}
.dd-d{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-t{font-size:.7rem;color:var(--dim);text-transform:uppercase;white-space:nowrap}
#sessions{display:flex;gap:4px;margin-left:auto;overflow:hidden;flex-shrink:1;min-width:0}
.sess{font-family:var(--mono);font-size:.74rem;padding:3px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap;cursor:default}
.sess i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dim);margin-right:5px;vertical-align:1px}
.sess.open i{background:var(--up);box-shadow:0 0 6px var(--up)}
.sess.pre i,.sess.post i,.sess.break i{background:var(--amber)}
.sess b{color:var(--text);font-weight:600;margin-left:3px}
.tb{display:flex;gap:4px;align-items:center}
.ib{width:2.3rem;height:2.3rem;display:grid;place-items:center;border-radius:var(--r);background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:1.05rem}
.ib:hover{color:var(--text);background:var(--hover);border-color:var(--line2)}
.ib.on{color:var(--amber)}
.ib svg{width:1.15rem;height:1.15rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#conn{width:9px;height:9px;border-radius:50%;background:var(--dim);margin:0 4px}
#conn.ok{background:var(--up);box-shadow:0 0 8px var(--up)}#conn.err{background:var(--down)}

/* ── ticker tape ── */
#tape{height:var(--tape);background:#06080b;border-bottom:1px solid var(--line);overflow:hidden;position:relative;flex-shrink:0;display:flex;align-items:center}
#tape-track{display:flex;white-space:nowrap;will-change:transform;animation:tape var(--tape-dur,120s) linear infinite}
#tape:hover #tape-track{animation-play-state:paused}
@keyframes tape{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.ti{display:inline-flex;gap:8px;align-items:baseline;padding:0 18px;font-family:var(--mono);font-size:.86rem;border-right:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.ti .l{color:var(--amber);font-weight:700}
.ti .lv{width:5px;height:5px;border-radius:50%;background:var(--up);align-self:center;box-shadow:0 0 5px var(--up)}
body.lite #tape-track{animation:none}
body.lite #tape{overflow-x:auto}

/* ── layout ── */
#layout{flex:1;display:flex;min-height:0}
#nav{width:var(--nav);background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:6px 0;gap:2px;flex-shrink:0;overflow-y:auto}
.nav-b{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 3px;color:var(--muted);background:none;border:0;border-left:2px solid transparent;cursor:pointer;font-size:.66rem;font-weight:700;letter-spacing:.07em;position:relative;text-transform:uppercase}
.nav-b svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-b:hover{color:var(--text);background:var(--hover)}
.nav-b.active{color:#fff;border-left-color:var(--accent);background:var(--accent-bg)}
.nav-b.active svg{stroke:var(--accent2)}
.nav-b .k{position:absolute;top:3px;right:5px;font-size:.58rem;color:var(--dim);font-family:var(--mono)}
.nav-b .bd{position:absolute;top:6px;left:58%;min-width:8px;height:8px;border-radius:5px;background:var(--down)}
#main{flex:1;min-width:0;overflow:auto;position:relative}
.page{display:none;padding:var(--gap)}
.page.active{display:block}

/* ── cards, grids ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:0 10px;min-height:2.6rem;border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
.card-t{font-family:var(--mono);font-size:.78rem;font-weight:800;letter-spacing:.09em;color:var(--amber);text-transform:uppercase;white-space:nowrap}
.card-s{color:var(--dim);font-size:.76rem;white-space:nowrap}
.card-b{padding:10px;overflow:auto;flex:1;min-height:0}
.card-b.np{padding:0}
.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fill,minmax(var(--min,280px),1fr))}
.mb{margin-bottom:var(--gap)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.full-h{height:calc(var(--vh) - 2*var(--gap) - 3.2rem);min-height:420px}

/* ── tabs ── */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;align-items:center}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--muted);padding:4px 9px;font-size:.8rem;border-radius:4px;cursor:pointer;white-space:nowrap;font-weight:600}
.tab:hover{color:var(--text);background:var(--hover)}
.tab.active{color:#fff;background:var(--accent)}
.subnav{display:flex;gap:8px;align-items:center;margin-bottom:var(--gap);flex-wrap:wrap}
.subnav>.tabs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.subnav .tab{padding:5px 11px;font-size:.85rem}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:2px;gap:2px}
.seg button{background:none;border:0;color:var(--muted);padding:2px 8px;border-radius:3px;cursor:pointer;font-size:.76rem;font-weight:700;font-family:var(--mono)}
.seg button.active{background:var(--line2);color:var(--text)}
.seg button:hover{color:var(--text)}

/* ── tables ── */
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
.t th{position:sticky;top:0;background:var(--card2);color:var(--dim);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.t td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
.t th:first-child,.t td:first-child,.t .l{text-align:left}
.t .c{text-align:center}
.t tbody tr:hover td{background:var(--hover)}
.t tr.click{cursor:pointer}
.t tr.sec td{background:var(--bg2);color:var(--dim);font-family:var(--sans);font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 8px}
.t th.sort{cursor:pointer}.t th.sort:hover{color:var(--text)}
.t.compact td{padding:3px 8px}
.sym{font-weight:700;color:var(--text);font-family:var(--mono)}
.nm{font-family:var(--sans);color:var(--dim);font-size:.75rem;display:block;max-width:15rem;overflow:hidden;text-overflow:ellipsis}
.t td.tdn{font-family:var(--sans);color:var(--muted);font-size:.8rem;max-width:16rem;overflow:hidden;text-overflow:ellipsis}
.fu1{animation:fu1 .9s}.fu2{animation:fu2 .9s}.fd1{animation:fd1 .9s}.fd2{animation:fd2 .9s}
@keyframes fu1{0%{background:rgba(31,191,117,.38)}100%{background:transparent}}
@keyframes fu2{0%{background:rgba(31,191,117,.38)}100%{background:transparent}}
@keyframes fd1{0%{background:rgba(240,68,79,.38)}100%{background:transparent}}
@keyframes fd2{0%{background:rgba(240,68,79,.38)}100%{background:transparent}}
body.lite .fu1,body.lite .fu2,body.lite .fd1,body.lite .fd2{animation:none}
.spk{display:inline-block;vertical-align:middle}
.bar52{position:relative;width:80px;height:6px;background:var(--line2);border-radius:3px;display:inline-block;vertical-align:middle}
.bar52 i{position:absolute;top:-2px;width:3px;height:10px;background:var(--amber);border-radius:1px;transform:translateX(-50%)}

/* ── controls ── */
.btn{background:var(--card2);border:1px solid var(--line2);color:var(--text);padding:5px 11px;border-radius:5px;cursor:pointer;font-size:.85rem;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#3b6fff}
.btn.sm{padding:2px 8px;font-size:.76rem}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{border-color:var(--line2)}
.btn.danger:hover{border-color:var(--down);color:var(--down)}
.btn:disabled{opacity:.5;cursor:default}
.in{background:var(--bg);border:1px solid var(--line2);color:var(--text);padding:5px 8px;border-radius:5px;font-size:.9rem;font-family:inherit;min-width:0;height:2.15rem}
textarea.in{height:auto;min-height:5rem;resize:vertical;line-height:1.4}
.in:focus{outline:0;border-color:var(--accent)}
select.in{padding-right:4px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--muted);font-weight:600;min-width:0}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted);cursor:pointer;white-space:nowrap}
label.chk input{accent-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-items:end}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--line2);color:var(--muted);padding:2px 8px;border-radius:12px;font-size:.76rem;cursor:pointer;font-weight:700;font-family:var(--mono);user-select:none}
.chip:hover{color:var(--text)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:#fff}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:.68rem;font-weight:800;font-family:var(--mono);background:var(--line);color:var(--muted);vertical-align:1px;white-space:nowrap}
.badge.live{background:var(--up-bg);color:var(--up)}
.badge.warn{background:rgba(240,169,46,.15);color:var(--amber)}
.badge.err{background:var(--down-bg);color:var(--down)}
.badge.blue{background:var(--accent-bg);color:var(--accent2)}
.note{font-size:.78rem;color:var(--dim);line-height:1.45}
.empty{padding:28px;text-align:center;color:var(--dim);font-size:.9rem}
.loading{padding:24px;text-align:center;color:var(--dim)}
.loading::after{content:'';display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;margin-left:8px;vertical-align:-2px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
hr.sep{border:0;border-top:1px solid var(--line);margin:10px 0}

/* ── KPIs ── */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .k{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--mono);font-size:1.4rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.78rem;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);gap:8px;font-size:.86rem}
.mini:last-child{border-bottom:0}
.mini .k{color:var(--muted);white-space:nowrap}
.mini .v{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── charts ── */
.chart{position:relative;width:100%;height:100%;min-height:140px;touch-action:pan-y}
.chart canvas{position:absolute;inset:0;width:100%;height:100%}
.chart-tip{position:absolute;pointer-events:none;background:rgba(9,12,16,.94);border:1px solid var(--line2);border-radius:4px;padding:5px 8px;font-family:var(--mono);font-size:.74rem;white-space:nowrap;display:none;z-index:3;line-height:1.5}
.tv-ph{height:100%;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:20px}
.tvbox{width:100%;height:100%}
.tvbox .tradingview-widget-container,.tvbox .tradingview-widget-container__widget{width:100%;height:100%}
.gauge{display:flex;flex-direction:column;align-items:center}
.gauge .g-l{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:-2px}
.tm{position:relative;width:100%;height:100%;overflow:hidden}
.tm-n{position:absolute;overflow:hidden;border:1px solid var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font-family:var(--mono);line-height:1.15;cursor:pointer}
.tm-n:hover{outline:2px solid #fff;outline-offset:-2px;z-index:2}
.tm-n b{font-weight:800}
.legend{display:flex;flex-direction:column;gap:4px;font-size:.8rem}
.legend div{display:flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.legend .v{margin-left:auto;font-family:var(--mono);color:var(--muted)}
.hbar{display:grid;grid-template-columns:5.5rem 1fr 4.8rem;gap:8px;align-items:center;font-size:.84rem;padding:3px 0}
.hbar .tr{position:relative;height:16px;background:var(--bg);border-radius:3px}
.hbar .tr .z{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.hbar .tr i{position:absolute;top:2px;bottom:2px;border-radius:2px}
.hbar .vv{text-align:right;font-family:var(--mono)}

/* ── market page ── */
.mk-grid{display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr) minmax(340px,25%);grid-template-rows:minmax(420px,calc(var(--vh) - 2*var(--gap) - var(--gap) - 290px)) 290px}
.mk-chart{grid-column:1;grid-row:1}
.mk-watch{grid-column:2;grid-row:1/span 2}
.mk-bottom{grid-column:1;grid-row:2;display:grid;gap:var(--gap);grid-template-columns:repeat(4,minmax(0,1fr));min-height:0}
.mk-multi{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;height:100%;background:var(--line)}
.mk-multi>div{background:var(--card);min-height:0}
.nchart{display:flex;flex-direction:column;height:100%}
.nchart .bar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nchart .cv{flex:1;min-height:0;padding:4px 0 0}
.qhdr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qhdr .p{font-family:var(--mono);font-size:1.25rem;font-weight:800}
.sess-t td{font-size:.82rem}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:1px}
.dot.open{background:var(--up);box-shadow:0 0 6px var(--up)}.dot.pre,.dot.post,.dot.break{background:var(--amber)}.dot.err{background:var(--down)}

/* ── news ── */
.breaking{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(240,68,79,.16),rgba(240,68,79,.03));border:1px solid rgba(240,68,79,.35);border-radius:var(--r);height:2.4rem;overflow:hidden;margin-bottom:var(--gap);padding-left:8px}
.live-b{background:var(--down);color:#fff;font-weight:800;font-family:var(--mono);font-size:.72rem;padding:2px 7px;border-radius:3px;animation:pulse 1.6s infinite;flex-shrink:0}
@keyframes pulse{50%{opacity:.55}}
body.lite .live-b{animation:none}
.br-wrap{flex:1;overflow:hidden;min-width:0;height:100%;display:flex;align-items:center}
.br-track{display:flex;white-space:nowrap;animation:tape var(--br-dur,90s) linear infinite}
.br-wrap:hover .br-track{animation-play-state:paused}
body.lite .br-track{animation:none}
.br-i{padding:0 22px;font-size:.9rem;border-right:1px solid rgba(240,68,79,.25)}
.br-i b{color:#ff8a92;font-family:var(--mono);font-size:.78rem;margin-right:6px}
.br-i a{color:var(--text)}
.news-cols{display:grid;gap:var(--gap);grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));height:calc(var(--vh) - 2*var(--gap) - 6.2rem);min-height:480px}
.news-cols .card-b{padding:0}
.ni{padding:7px 10px 8px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.ni:hover{background:var(--hover)}
.ni.hi{border-left-color:var(--down)}.ni.md{border-left-color:var(--amber)}
.ni .meta{display:flex;gap:6px;align-items:center;font-size:.7rem;color:var(--dim);margin-bottom:2px;flex-wrap:wrap}
.ni .meta .tm2{font-family:var(--mono);color:var(--muted)}
.ni .src{color:var(--accent2);font-weight:700}
.ni .tt{font-size:.92rem;line-height:1.32;color:var(--text);display:block}
.ni .tt:visited{color:#aab4c2}
.ni.new .tt::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-right:6px;vertical-align:2px}
.ni .sm{font-size:.8rem;color:var(--muted);margin-top:3px;line-height:1.4}
.ni .trl{margin-left:auto;font-size:.66rem;color:var(--dim)}
.tag{font-size:.6rem;padding:0 4px;border-radius:2px;background:var(--line);color:var(--muted);font-weight:800;font-family:var(--mono);cursor:pointer;letter-spacing:.02em}
.tag.r{background:var(--down-bg);color:#ff8a92}.tag.a{background:rgba(240,169,46,.14);color:var(--amber)}.tag.b{background:var(--accent-bg);color:var(--accent2)}.tag.g{background:var(--up-bg);color:var(--up)}
.rg{font-size:.6rem;font-weight:800;padding:0 4px;border-radius:2px;font-family:var(--mono);color:#fff}
.rg.cz{background:#11457e}.rg.us{background:#7a1f2b}.rg.world{background:#1f5d4a}

/* ── calendar ── */
.imp{display:inline-flex;gap:2px;align-items:flex-end;height:12px;vertical-align:-1px}
.imp i{width:4px;background:var(--line2);border-radius:1px}
.imp i:nth-child(1){height:5px}.imp i:nth-child(2){height:8px}.imp i:nth-child(3){height:12px}
.imp.High i{background:var(--down)}
.imp.Medium i:nth-child(-n+2){background:var(--amber)}
.imp.Low i:nth-child(1){background:#c9b94a}
.imp.Holiday i{background:var(--purple)}
.cc{font-family:var(--mono);font-weight:800;font-size:.72rem;padding:1px 5px;border-radius:3px;background:var(--line);color:var(--muted)}
.cc.USD{background:#1c2b4d;color:#8fb4ff}.cc.EUR{background:#1d2f5c;color:#ffd23f}.cc.CZK{background:#11457e;color:#fff}.cc.GBP{background:#3b1d2b;color:#ff9fb5}.cc.JPY{background:#3d1f1f;color:#ff8a80}.cc.CNY{background:#4a1515;color:#ffd166}.cc.CAD{background:#3a1d1d;color:#ffb3b3}.cc.AUD{background:#16304a;color:#9ad1ff}.cc.CHF{background:#3d1c1c;color:#fff}.cc.NZD{background:#1b2a3a;color:#b3d4ff}
tr.done td{opacity:.55}
tr.nextev td{background:rgba(41,98,255,.1)!important}
tr.nowline td{padding:0!important;height:2px;background:var(--accent)!important;border:0}
.cdown{font-family:var(--mono);color:var(--amber);font-weight:700}
.cb-card .rate{font-family:var(--mono);font-size:2rem;font-weight:800}
.mtile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.mtile:hover{border-color:var(--line2);background:var(--card2)}
.mtile .k{font-size:.74rem;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile .v{font-family:var(--mono);font-size:1.3rem;font-weight:800}
.mtile .s{font-size:.72rem;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.grp-h{font-family:var(--mono);font-size:.75rem;font-weight:800;color:var(--amber);letter-spacing:.09em;text-transform:uppercase;margin:14px 0 6px}

/* ── crypto ── */
.ctile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;min-width:0}
.ctile:hover{border-color:var(--line2)}
.ctile .h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ctile .p{font-family:var(--mono);font-size:1.3rem;font-weight:800;margin:3px 0;font-variant-numeric:tabular-nums}
.ctile .s{font-family:var(--mono);font-size:.74rem;color:var(--dim)}
.prog{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.fee{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px;text-align:center;min-width:0}
.fee .v{font-family:var(--mono);font-size:1.25rem;font-weight:800}
.fee .k{font-size:.68rem;color:var(--dim);text-transform:uppercase;font-weight:700}
.coin-i{width:18px;height:18px;border-radius:50%;vertical-align:-4px;margin-right:6px;background:var(--line)}

.split{display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr) 330px}
.sugg{position:absolute;top:calc(100% + 3px);left:0;min-width:100%;width:max-content;max-width:440px;background:var(--card2);border:1px solid var(--line2);border-radius:5px;z-index:70;display:none;box-shadow:0 12px 30px rgba(0,0,0,.55);max-height:320px;overflow:auto}
.sugg.open{display:block}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}

/* ── stock analyzer ── */
.fa-search{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fa-h{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.fa-h .nm2{font-size:1.35rem;font-weight:800}
.fa-h .meta{color:var(--muted);font-size:.84rem;margin-top:3px}
.fa-h .px{font-family:var(--mono);font-size:1.9rem;font-weight:800;line-height:1.1}
.fa-big{font-family:var(--mono);font-size:2.3rem;font-weight:800;line-height:1.1}
.verdict{display:inline-block;padding:4px 10px;border-radius:5px;font-weight:800;font-size:.9rem;letter-spacing:.02em}
.verdict.v2{background:var(--up-bg);color:var(--up)}.verdict.v1{background:rgba(31,191,117,.08);color:#7bd8a8}.verdict.v0{background:rgba(240,169,46,.14);color:var(--amber)}.verdict.v-1{background:rgba(240,68,79,.08);color:#ff8a92}.verdict.v-2{background:var(--down-bg);color:var(--down)}
.ff{position:relative;padding:2px 0 24px;--ffl:15rem;--ffv:9.5rem}
.ff-r{display:grid;grid-template-columns:var(--ffl) 1fr var(--ffv);gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.84rem}
.ff-r .l1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ff-r .vv{text-align:right;font-family:var(--mono);white-space:nowrap}
.ff-t{position:relative;height:18px;background:linear-gradient(90deg,transparent,rgba(40,50,65,.25),transparent)}
.ff-b{position:absolute;top:6px;height:6px;border-radius:3px;opacity:.5}
.ff-m{position:absolute;top:1px;width:5px;height:16px;border-radius:2px;transform:translateX(-50%)}
.ff-ln{position:absolute;top:0;bottom:22px;width:0;pointer-events:none;border-left:2px solid #e6edf3;z-index:1}
.ff-ln.fv{border-left:2px dashed var(--accent2)}
.ff-ln span{position:absolute;bottom:-19px;transform:translateX(-50%);font-size:.68rem;white-space:nowrap;font-family:var(--mono);background:var(--card);padding:0 3px}
.ff-ax{position:absolute;bottom:0;height:16px;font-size:.66rem;color:var(--dim);font-family:var(--mono);transform:translateX(-50%)}
.sbar{display:grid;grid-template-columns:7.5rem 1fr 2.6rem;gap:8px;align-items:center;font-size:.84rem;padding:3px 0}
.sbar .tr{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.sbar .tr i{display:block;height:100%;border-radius:4px}
.sbar b{font-family:var(--mono);text-align:right}
.rt{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 22px}
.rt .mini .v.g{color:var(--up)}.rt .mini .v.b{color:var(--down)}.rt .mini .v.m{color:var(--amber)}
.chk-l{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.chk-l .ic2{width:1.2rem;text-align:center;font-weight:800}
.chk-l .d{margin-left:auto;font-family:var(--mono);color:var(--muted);font-size:.78rem;white-space:nowrap}
.rec-bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--bg)}
.rec-bar i{display:block;height:100%}
.as-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;align-items:end}
.as-grid .in{width:100%}
.svgw{width:100%;display:block}

/* ── portfolio / tools ── */
.app-t{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:12px;align-items:center;min-width:0}
.app-t .ic{width:2.6rem;height:2.6rem;border-radius:10px;display:grid;place-items:center;font-weight:800;font-family:var(--mono);font-size:1.1rem;flex-shrink:0;color:#fff}
.app-t .nmx{font-weight:700}
.app-t .ds{font-size:.76rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.res .k{font-size:.68rem;color:var(--dim);text-transform:uppercase;font-weight:700}
.res .v{font-family:var(--mono);font-size:1.05rem;font-weight:800}

/* ── modal, toasts, statusbar ── */
#modal-root .ov{position:fixed;inset:0;background:rgba(3,5,8,.74);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:10px;width:min(920px,100%);box-shadow:0 30px 90px rgba(0,0,0,.7);display:flex;flex-direction:column;max-height:92vh}
.modal.wide{width:min(1280px,100%)}
.modal.narrow{width:min(560px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal-t{font-family:var(--mono);font-weight:800;font-size:1rem;letter-spacing:.04em}
.modal-b{padding:14px;overflow:auto;min-height:0}
#toasts{position:fixed;right:14px;top:calc(var(--top) + var(--tape) + 10px);z-index:120;display:flex;flex-direction:column;gap:8px;width:min(400px,calc(100vw - 28px));pointer-events:none}
.toast{background:var(--card2);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:6px;padding:10px 30px 10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .25s;font-size:.86rem;pointer-events:auto;position:relative;line-height:1.4}
.toast.ok{border-left-color:var(--up)}.toast.err{border-left-color:var(--down)}.toast.warn{border-left-color:var(--amber)}.toast.alert{border-left-color:var(--amber);background:#1d1a12}.toast.news{border-left-color:var(--down)}
.toast .x{position:absolute;top:6px;right:8px;cursor:pointer;color:var(--dim);background:none;border:0}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
#statusbar{height:var(--status);display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--bg2);border-top:1px solid var(--line);font-family:var(--mono);font-size:.7rem;color:var(--dim);flex-shrink:0;white-space:nowrap;overflow:hidden}
.sbs{display:inline-flex;align-items:center;gap:4px;cursor:default}
.sbs i{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.sbs.ok i{background:var(--up)}.sbs.err i{background:var(--down)}.sbs.warn i{background:var(--amber)}
kbd{font-family:var(--mono);font-size:.72rem;background:var(--bg);border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--text)}
.help-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 18px}
.help-g div{display:flex;gap:10px;font-size:.84rem;padding:3px 0;border-bottom:1px dashed var(--line)}
.help-g b{font-family:var(--mono);color:var(--amber);min-width:7.5rem}

/* ── responsive ── */
@media (max-width:1500px){.mk-bottom{grid-template-columns:repeat(2,minmax(0,1fr))}.mk-grid{grid-template-rows:minmax(420px,62vh) auto}.mk-bottom>.card{height:290px}.news-cols{--cols:2!important;height:auto}.news-cols>.card{height:70vh}}
@media (max-width:1100px){
  .mk-grid{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .mk-chart{grid-row:auto;height:62vh;min-height:380px}.mk-watch{grid-column:auto;grid-row:auto;height:640px}.mk-bottom{grid-column:auto;grid-row:auto}
  .g3,.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  #sessions{display:none}
}
@media (max-width:760px){
  :root{--nav:0px;--gap:8px}
  #layout{flex-direction:column}
  #nav{order:2;width:100%;flex-direction:row;height:3.9rem;border-right:0;border-top:1px solid var(--line);padding:0;overflow-x:auto;flex-shrink:0}
  .nav-b{flex:1;min-width:3.6rem;border-left:0;border-top:2px solid transparent;padding:6px 2px}
  .nav-b.active{border-top-color:var(--accent)}
  .nav-b .k{display:none}
  #statusbar{display:none}
  :root{--status:0px}
  .brand span{display:none}
  .g2,.g3,.g4,.g6,.mk-bottom{grid-template-columns:minmax(0,1fr)}
  .news-cols{--cols:1!important}
  .tb .hide-m{display:none}
  .ff{--ffl:7.5rem;--ffv:4.6rem}
  .ff-r .vv span{display:none}
  .ff-r .l1 .badge{display:none}
  .modal-b{padding:10px}
}
</style>

<body>
<header id="topbar">

    <button class="ib hide-m" id="btn-full" title="Celá obrazovka (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" id="btn-settings" title="Nastavení (,)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
  </div>
</header>
<div id="tape" title="Ticker – klikněte pro graf"><div id="tape-track"></div></div>
<div id="layout">
  <nav id="nav"></nav>
  <main id="main">
    <section class="page" id="page-market"></section>
    <section class="page" id="page-stock"></section>
    <section class="page" id="page-calendar"></section>
    <section class="page" id="page-news"></section>
    <section class="page" id="page-analytics"></section>
    <section class="page" id="page-crypto"></section>
    <section class="page" id="page-portfolio"></section>
    <section class="page" id="page-tools"></section>
  </main>
</div>
<footer id="statusbar">
  <span id="sb-src"></span><span class="sp"></span><span id="sb-info"></span><span id="sb-mode"></span><span id="sb-ver">FinTerm</span><span id="sb-clock"></span>
</footer>
<div id="modal-root"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   FinTerm – front-end (single file, vanilla JS)
   ════════════════════════════════════════════════════════════════════ */

/* ───────── helpers ───────── */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const numIn = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return Number.isFinite(n) ? n : null; };
const clone = o => JSON.parse(JSON.stringify(o));
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
function deepMerge(base, over) {
  if (!isObj(over)) return base;
  for (const [k, v] of Object.entries(over)) base[k] = isObj(v) && isObj(base[k]) ? deepMerge(base[k], v) : v;
  return base;
}
const PALETTE = ['#2962ff', '#1fbf75', '#f0a92e', '#a371f7', '#3fa7ff', '#f0444f', '#14b8a6', '#e879f9', '#94a3b8', '#facc15', '#fb7185', '#22d3ee', '#84cc16', '#f97316'];
const UPC = '#1fbf75', DNC = '#f0444f';

const Bus = {
  h: {},
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); },
  emit(e, d) { (this.h[e] || []).forEach(f => { try { f(d); } catch (err) { console.error(err); } }); },
};

/* ───────── formatting ───────── */
const F = {
  loc: 'cs-CZ', tz: 'Europe/Prague', _nf: {}, _df: {},
  setLocale(loc, tz) { this.loc = loc || 'cs-CZ'; this.tz = tz || 'Europe/Prague'; this._nf = {}; this._df = {}; },
  nf(min, max) { const k = min + '_' + max; return this._nf[k] || (this._nf[k] = new Intl.NumberFormat(this.loc, { minimumFractionDigits: min, maximumFractionDigits: max })); },
  n(v, d = 2, dmin = d) { return isNum(v) ? this.nf(Math.min(dmin, d), d).format(v) : '—'; },
  dec(v) { const a = Math.abs(v); return !isNum(v) ? 2 : a >= 100 ? 2 : a >= 10 ? 2 : a >= 1 ? 3 : a >= 0.1 ? 4 : a >= 0.001 ? 5 : 8; },
  p(v, d) { return isNum(v) ? this.n(v, d ?? this.dec(v)) : '—'; },
  sgn(v) { return v > 0 ? '+' : v < 0 ? '−' : ''; },
  pct(v, d = 2) { return isNum(v) ? this.sgn(v) + this.n(Math.abs(v), d) + ' %' : '—'; },
  chg(v, d) { return isNum(v) ? this.sgn(v) + this.n(Math.abs(v), d ?? this.dec(v)) : '—'; },
  big(v, d = 2) {
    if (!isNum(v)) return '—';
    const a = Math.abs(v);
    const u = this.loc.startsWith('cs') ? [[1e12, ' bil.'], [1e9, ' mld.'], [1e6, ' mil.'], [1e3, ' tis.']] : [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
    for (const [m, s] of u) if (a >= m) return this.n(v / m, d) + s;
    return this.n(v, 0);

const API = {
  async req(method, path, body, timeout = 25000) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeout);
    try {
      const r = await fetch(path, {
        method, signal: ctl.signal, credentials: 'same-origin',
        headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });
      const j = await r.json().catch(() => null);
      if (!r.ok) throw new Error((j && j.error) || 'HTTP ' + r.status);
      return j;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('timeout');
      throw e;
    } finally { clearTimeout(t); }
  },
  get(p, t) { return this.req('GET', p, undefined, t); },
  put(p, b) { return this.req('PUT', p, b); },
  post(p, b) { return this.req('POST', p, b ?? {}); },
};

function yToTv(y) {
  if (byY[y]) return byY[y].tv;
  let m;
  if ((m = y.match(/^([A-Z0-9]+)-USD$/))) return `BINANCE:${m[1]}USDT`;
  if ((m = y.match(/^([A-Z]{6})=X$/))) return `FX_IDC:${m[1]}`;
  if ((m = y.match(/^([A-Z]{3})=X$/))) return `FX_IDC:USD${m[1]}`;
  const sfx = { PR: 'PSECZ', DE: 'XETR', F: 'FWB', L: 'LSE', PA: 'EURONEXT', AS: 'EURONEXT', BR: 'EURONEXT', MI: 'MIL', MC: 'BME', SW: 'SIX', VI: 'VIE', WA: 'GPW', ST: 'OMXSTO', HE: 'OMXHEX', CO: 'OMXCOP', OL: 'OSL', TO: 'TSX', V: 'TSXV', AX: 'ASX', HK: 'HKEX', T: 'TSE', KS: 'KRX', SS: 'SSE', SZ: 'SZSE', NS: 'NSE', BO: 'BSE', SA: 'BMFBOVESPA', MX: 'BMV' };

  if (y.endsWith('=F')) return y.replace('=F', '1!');

const Q = {

const STATE_L = { REGULAR: 'otevřeno', CLOSED: 'zavřeno', PRE: 'pre-market', PREPRE: 'zavřeno', POST: 'after-hours', POSTPOST: 'zavřeno' };
function paintQuotes(only) {
  const els = document.querySelectorAll('[data-q]');
  for (const el of els) {
    const s = el.dataset.q;
    if (only && !only.has(s)) continue;
    const q = Q.d[s];
    if (!q) continue;
    if (el.offsetParent === null && !el.closest('#tape')) continue;
    const f = el.dataset.f || 'price';
    let txt, cls = null;
    switch (f) {
      case 'price': txt = fmtPrice(s, q.price); break;
      case 'pct': txt = F.pct(q.changePct); cls = F.cls(q.changePct); break;
      case 'chg': txt = F.chg(q.change, decFor(s, q.price)); cls = F.cls(q.change); break;
      case 'high': txt = fmtPrice(s, q.high); break;
      case 'low': txt = fmtPrice(s, q.low); break;
      case 'vol': txt = F.big(q.volume, 1); break;
      case 'qvol': txt = F.big(isNum(q.quoteVol) ? q.quoteVol : q.volume * q.price, 1); break;
      case 'mcap': txt = F.big(q.marketCap); break;
      case 'name': txt = q.name || s; break;
      case 'state': txt = q.live ? 'live' : (STATE_L[q.marketState] || q.marketState || ''); break;
      case 'range': txt = `${fmtPrice(s, q.low)} – ${fmtPrice(s, q.high)}`; break;
      case 'bar52': {
        if (isNum(q.high52) && isNum(q.low52) && q.high52 > q.low52) {
          const pos = clamp((q.price - q.low52) / (q.high52 - q.low52) * 100, 0, 100);
          const i = el.querySelector('i') || el.appendChild(document.createElement('i'));
          i.style.left = pos + '%';
          el.title = `52T: ${fmtPrice(s, q.low52)} – ${fmtPrice(s, q.high52)}`;
        }
        continue;
      }
      default: continue;
    }
    if (el.textContent !== txt) {
      if (f === 'price' && el.textContent && Q.dir[s]) {
        const up = Q.dir[s] > 0;
        const a = up ? 'fu' : 'fd';
        const n = el.classList.contains(a + '1') ? 2 : 1;
        el.classList.remove('fu1', 'fu2', 'fd1', 'fd2');
        el.classList.add(a + n);
      }
      el.textContent = txt;
    }
    if (cls) { el.classList.toggle('up', cls === 'up'); el.classList.toggle('dn', cls === 'dn'); el.classList.toggle('fl', cls === 'fl'); }

const Timers = {
  list: [],
  add(name, ms, fn, cond) { const t = { name, ms, fn, cond: cond || (() => true), last: 0, busy: false }; this.list.push(t); return t; },
  tick() {

const NRANGES = { '1D': ['1d', '5m'], '5D': ['5d', '15m'], '1M': ['1mo', '60m'], '3M': ['3mo', '1d'], '6M': ['6mo', '1d'], '1R': ['1y', '1d'], '5R': ['5y', '1wk'], MAX: ['max', '1mo'] };

    <span class="sp"></span><span class="note nstat"></span></div><div class="cv"></div></div>`;
  const ch = new Chart($('.cv', el));

    const d = st.data;

    const dec = decFor(y, d.c[d.c.length - 1]);

  };

/* ───────── shared data cache ───────── */
const Data = {
  _c: {},
  get(key, url, ttl) {
    const c = this._c[key] || (this._c[key] = {});
    if (c.v !== undefined && Date.now() - c.t < ttl) return Promise.resolve(c.v);
    if (c.p) return c.p;
    c.p = API.get(url).then(v => { c.v = v; c.t = Date.now(); return v; })
      .catch(e => { if (c.v !== undefined) return c.v; throw e; })
      .finally(() => { c.p = null; });
    return c.p;
  },
  drop(key) { delete this._c[key]; },
  cb() { return this.get('cb', 'api/cb', 30 * 60e3); },
  fx() { return this.get('fx', 'api/fx', 60e3); },
  cg() { return this.get('cg', 'api/crypto/global', 60e3); },
  cgm() { return this.get('cgm', 'api/crypto/markets', 120e3); },
  fng() { return this.get('fng', 'api/fng', 30 * 60e3); },
  macro() { return this.get('macro', 'api/macro', 15 * 60e3); },
  cal() { return this.get('cal', 'api/calendar', 5 * 60e3); },
};
async function loadSparks(syms, scope) {
  if (!syms.length || !Store.server) return;
  try {
    const res = await API.get('api/spark?s=' + encodeURIComponent(syms.join(',')));
    for (const td of $$('[data-sp]', scope)) { const v = res[td.dataset.sp]; if (v) td.innerHTML = spark(v.c, { base: v.prev }); }
  } catch {}
}

const News = {
  items: [], updated: 0, loading: null,
  load(force) {
    if (!Store.server) return Promise.resolve(this.items);
    if (!force && this.items.length && Date.now() - this.updated < 60e3) return Promise.resolve(this.items);
    if (this.loading) return this.loading;
    this.loading = API.get('api/news?limit=1200').then(r => {
      this.items = r.items || [];
      this.updated = r.updated || Date.now();
      setSrc('news', true);
      Bus.emit('news', this.items);
      return this.items;
    }).catch(e => { setSrc('news', false, e.message); return this.items; }).finally(() => { this.loading = null; });
    return this.loading;
  },
};

        <div class="tabs" data-g="cal"><button class="tab" data-t="up">Nadcházející</button><button class="tab" data-t="hist">Historie</button><button class="tab" data-t="cb">Centrální banky</button><button class="tab" data-t="macro">Makro data</button><button class="tab" data-t="tv">TradingView kalendář</button></div>
        <span class="sp"></span>
        <div class="chips cal-f" id="cal-imp">${[['High', '3'], ['Medium', '2'], ['Low', '1'], ['Holiday', 'svátky']].map(([v, l]) => `<span class="chip ${f.imp.includes(v) ? 'on' : ''}" data-v="${v}">${impBars(v)} ${l}</span>`).join('')}</div>
        <div class="chips cal-f" id="cal-cur">${this.CUR.map(c => `<span class="chip ${f.cur.includes(c) ? 'on' : ''}" data-v="${c}">${c === 'All' ? 'GLOBÁLNÍ' : c}</span>`).join('')}</div>
        <input class="in cal-f" id="cal-q" placeholder="Hledat: CPI, NFP, PMI…" value="${esc(f.q)}" style="width:12rem">
      </div>
      <div data-g="cal" data-p="up"><div class="card"><div class="card-h"><span class="card-t">Ekonomický kalendář</span><span class="card-s" id="cal-next"></span><span class="sp"></span><label class="chk"><input type="checkbox" id="cal-hide" ${f.hideDone ? 'checked' : ''}> skrýt proběhlé</label><span class="card-s" id="cal-upd"></span></div><div class="card-b np" id="cal-up"><div class="loading">Načítám kalendář</div></div></div></div>
      <div data-g="cal" data-p="hist"><div class="card"><div class="card-h"><span class="card-t">Historie vyhlášení · forecast vs. actual</span><div class="seg" id="cal-days">${[7, 30, 90, 180].map(d => `<button data-v="${d}" class="${f.days === d ? 'active' : ''}">${d} d</button>`).join('')}</div><span class="sp"></span><span class="card-s" id="cal-hn"></span></div><div class="card-b np" id="cal-hist"></div><div class="note" style="padding:8px 10px;border-top:1px solid var(--line)" id="cal-hnote"></div></div></div>
      <div data-g="cal" data-p="cb"><div class="grid auto" style="--min:320px" id="cal-cb"><div class="loading">Načítám</div></div><p class="note" style="margin-top:8px">Sazby: FED a ECB z FRED (St. Louis Fed), ČNB přímo z cnb.cz. Termíny zasedání jsou uloženy v serveru (ověřeno pro 2026/2027) – BoJ je orientační.</p></div>
      <div data-g="cal" data-p="macro"><div id="cal-macro"><div class="loading">Načítám makro data (FRED · ČNB)</div></div></div>
      <div data-g="cal" data-p="tv"><div class="card full-h"><div class="card-h"><span class="card-t">TradingView ekonomický kalendář</span><span class="sp"></span><span class="card-s">filtry dopadu a zemí se přebírají z lišty nahoře · obsahuje i CZ data a actual hodnoty</span></div><div class="card-b np" id="cal-tv"></div></div></div>`;
    const toggle = (id, key) => $(id).addEventListener('click', e => {
      const ch = e.target.closest('.chip'); if (!ch) return;
      const v = ch.dataset.v, arr = L().cal[key], i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1); else arr.push(v);
      ch.classList.toggle('on', i < 0);
      saveLayout(); this.refreshView();
    });
    toggle('#cal-imp', 'imp'); toggle('#cal-cur', 'cur');
    $('#cal-q').addEventListener('input', debounce(e => { L().cal.q = e.target.value.trim(); saveLayout(); this.refreshView(); }, 200));
    $('#cal-hide').onchange = e => { L().cal.hideDone = e.target.checked; saveLayout(); this.renderUp(); };
    seg($('#cal-days'), v => { L().cal.days = +v; saveLayout(); this.renderHist(); });
    this.tabs = tabs($('[data-g="cal"].tabs'), t => this.onTab(t), false);
    $('#cal-macro').addEventListener('click', e => { const t = e.target.closest('.mtile'); if (t) this.macroDetail(t.dataset.key); });
    Timers.add('cal-tick', 1000, () => this.tick(), () => App.page === 'calendar');
    Timers.add('cal-load', 10 * 60e3, () => { Data.drop('cal'); return this.load(); }, () => App.page === 'calendar');
  },
  show(sub) { this.tabs.set(sub || L().cal.tab || 'up'); },
  onTab(t) {
    this.view = t; L().cal.tab = t; saveLayout();
    $$('.cal-f').forEach(e => { e.hidden = !['up', 'hist', 'tv'].includes(t) || (t === 'tv' && e.id === 'cal-q'); });
    if (t === 'up' || t === 'hist') this.load();
    else if (t === 'cb') this.renderCB();
    else if (t === 'macro') this.renderMacro();
    else if (t === 'tv') this.renderTV();
  },
  refreshView() { if (this.view === 'up') this.renderUp(); else if (this.view === 'hist') this.renderHist(); else if (this.view === 'tv') this.renderTV(); },
  async load() {
    try { this.data = await Data.cal(); setSrc('cal', true); }
    catch (e) { setSrc('cal', false, e.message); if (!this.data) { $('#cal-up').innerHTML = `<div class="empty">Kalendář nedostupný: ${esc(e.message)}</div>`; return; } }
    this.renderUp(); this.renderHist();
  },
  filt(e) {
    const f = L().cal;
    return f.imp.includes(e.impact) && f.cur.includes(e.country) && (!f.q || e.title.toLowerCase().includes(f.q.toLowerCase()));
  },
  valCell(e) {
    if (!e.actual) return '<td class="dim">—</td>';
    const a = parseVal(e.actual), fc = parseVal(e.forecast);
    const cls = isNum(a) && isNum(fc) ? F.cls(a - fc) : '';
    return `<td class="${cls}" ${e.derived ? 'title="Odvozeno z hodnoty „previous“ následujícího vydání (může obsahovat revizi)"' : ''}><b>${esc(e.actual)}</b>${e.derived ? '<span class="dim">*</span>' : ''}</td>`;
  },
  evTitle(e) { return `${esc(e.title)}${e.src === 'cb' ? ' <span class="badge blue">CB</span>' : ''}${e.approx ? ' <span class="badge warn" title="orientační termín">≈</span>' : ''}`; },
  renderUp() {
    if (!this.data) return;
    const now = Date.now(), today = F.dayKey(now), f = L().cal, horizon = now + 75 * 864e5;
    let list = this.data.events.filter(e => this.filt(e) && F.dayKey(e.ts) >= today && e.ts <= horizon);
    if (f.hideDone) list = list.filter(e => e.ts > now - 5 * 60e3);
    const box = $('#cal-up');
    if (!list.length) { box.innerHTML = '<div class="empty">Žádné události pro zvolené filtry.</div>'; return; }
    let html = '', day = '', nowDone = false;
    const next = list.find(e => e.ts > now);
    for (const e of list) {
      const dk = F.dayKey(e.ts);
      if (dk !== day) { day = dk; html += `<tr class="sec"><td colspan="8">${esc(F.dlong(e.ts))}${dk === today ? ' · dnes' : ''}</td></tr>`; }
      if (!nowDone && e.ts > now) { nowDone = true; if (list[0].ts <= now) html += '<tr class="nowline"><td colspan="8"></td></tr>'; }
      const done = e.ts <= now;
      html += `<tr class="${done ? 'done' : ''} ${e === next ? 'nextev' : ''}"><td>${F.time(e.ts)}</td><td class="l"><span class="cc ${esc(e.country)}">${esc(e.country === 'All' ? 'GLB' : e.country)}</span></td><td class="c">${impBars(e.impact)}</td><td class="l" style="white-space:normal;font-family:var(--sans)">${this.evTitle(e)}</td>${this.valCell(e)}<td>${esc(e.forecast || '—')}</td><td class="dim">${esc(e.previous || '—')}</td><td class="cdown" data-ts="${e.ts}">${done ? '' : F.until(e.ts)}</td></tr>`;
    }
    box.innerHTML = `<table class="t"><thead><tr><th>Čas</th><th class="l">Země</th><th class="c">Dopad</th><th class="l">Událost</th><th>Actual</th><th>Forecast</th><th>Previous</th><th>Za</th></tr></thead><tbody>${html}</tbody></table>`;
    $('#cal-upd').textContent = this.data.updated ? 'ForexFactory · ' + F.time(this.data.updated) : '';
    this.tick();
  },
  tick() {
    if (!this.data) return;
    const now = Date.now();
    $$('#cal-up [data-ts]').forEach(td => { const ts = +td.dataset.ts; td.textContent = ts > now ? F.until(ts) : ''; });
    const nx = this.data.events.find(e => e.ts > now && e.impact === 'High' && this.filt(e));
    const el = $('#cal-next');
    if (el) el.innerHTML = nx ? `další ${impBars('High')} <b class="cc ${esc(nx.country)}">${esc(nx.country)}</b> ${esc(nx.title)} · <span class="cdown">${F.until(nx.ts)}</span>` : '';
    $$('#cal-cb [data-ts]').forEach(s => { s.textContent = F.until(+s.dataset.ts); });
  },
  renderHist() {
    if (!this.data) return;
    const now = Date.now(), f = L().cal, since = now - f.days * 864e5;
    const list = this.data.events.filter(e => e.ts < now && e.ts >= since && e.impact !== 'Holiday' && this.filt(e)).sort((a, b) => b.ts - a.ts);
    const rows = list.map(e => {
      const a = parseVal(e.actual), fc = parseVal(e.forecast);
      const sur = isNum(a) && isNum(fc) ? a - fc : null;
      const surTxt = sur == null ? '<td class="dim">—</td>' : `<td class="${F.cls(sur)}">${sur === 0 ? 'v souladu' : (sur > 0 ? '▲ ' : '▼ ') + F.n(Math.abs(sur), Math.abs(sur) >= 100 ? 0 : 2)}</td>`;
      return `<tr><td>${esc(F.dshort(e.ts))} ${F.time(e.ts)}</td><td class="l"><span class="cc ${esc(e.country)}">${esc(e.country === 'All' ? 'GLB' : e.country)}</span></td><td class="c">${impBars(e.impact)}</td><td class="l" style="white-space:normal;font-family:var(--sans)">${this.evTitle(e)}</td>${this.valCell(e)}<td>${esc(e.forecast || '—')}</td><td class="dim">${esc(e.previous || '—')}</td>${surTxt}</tr>`;
    }).join('');
    $('#cal-hist').innerHTML = list.length ? `<table class="t"><thead><tr><th>Datum</th><th class="l">Země</th><th class="c">Dopad</th><th class="l">Událost</th><th>Actual</th><th>Forecast</th><th>Previous</th><th>Překvapení</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">Žádné proběhlé události v archivu pro zvolené filtry.</div>';
    $('#cal-hn').textContent = list.length + ' událostí';
    $('#cal-hnote').innerHTML = `Archiv obsahuje <b>${this.data.archiveCount || 0}</b> událostí. ForexFactory poskytuje jen aktuální týden, proto server <b>každou hodinu archivuje</b> a historie se plní od prvního spuštění. Hodnota <b>actual</b> označená * je odvozená z „previous“ následujícího vydání. Dlouhou historii nabízí <a href="#calendar/macro">Makro data</a> (FRED, od r. 2005) a <a href="#calendar/tv">TradingView kalendář</a>.`;
  },
  async renderCB() {
    const box = $('#cal-cb');
    let cb;
    try { cb = await Data.cb(); } catch (e) { box.innerHTML = `<div class="empty">Nedostupné: ${esc(e.message)}</div>`; return; }
    box.innerHTML = cb.map(b => {
      const rate = b.bank === 'FED' && isNum(b.rateLow) ? `${F.n(b.rateLow, 2)}–${F.n(b.rate, 2)} %` : isNum(b.rate) ? F.n(b.rate, 2) + ' %' : '—';
      const ch = b.last && isNum(b.rate) ? b.rate - b.last.from : null;
      const last = b.last ? `poslední změna ${F.date(Date.parse(b.last.date))} <span class="${ch > 0 ? 'dn' : ch < 0 ? 'up' : ''}">${ch > 0 ? '▲' : '▼'} ${F.chg(ch * 100, 0)} bp</span> (z ${F.n(b.last.from, 2)} %)` : isNum(b.rate) ? '' : 'sazba není v bezplatném zdroji';
      const nx = (b.next || []);
      return `<div class="card cb-card"><div class="card-h"><span class="card-t">${esc(b.name)}</span><span class="cc ${esc(b.cur)}">${esc(b.cur)}</span><span class="sp"></span><span class="card-s">${esc(b.src)}</span></div>
        <div class="card-b"><div class="rate">${rate}</div><div class="note mb">${last}</div>
        ${nx.length ? `<div class="mini"><span class="k">Příští zasedání</span><span class="v">${esc(F.dlong(nx[0]))} ${F.time(nx[0])}</span></div><div class="mini"><span class="k">Odpočet</span><span class="v cdown" data-ts="${nx[0]}">${F.until(nx[0])}</span></div>` : '<div class="note">Termíny zasedání nejsou k dispozici</div>'}
        ${nx.slice(1).map(t => `<div class="mini"><span class="k dim">další</span><span class="v dim">${esc(F.dshort(t))} ${new Date(t).getFullYear()}</span></div>`).join('')}
        ${b.history && b.history.length ? `<div style="height:150px;margin-top:8px" id="cbch-${b.bank}"></div>` : ''}</div></div>`;
    }).join('');
    cb.forEach(b => { const el = $('#cbch-' + b.bank); if (el) new Chart(el, { unit: ' %', monthly: true }).set([{ name: b.bank, data: b.history.map(([d, v]) => [Date.parse(d), v]), step: true, color: '#5c87ff', area: true }]); });
  },
  async renderMacro() {
    const box = $('#cal-macro');
    let rows;
    try { rows = await Data.macro(); setSrc('macro', true); } catch (e) { setSrc('macro', false, e.message); box.innerHTML = `<div class="empty">Makro data nedostupná: ${esc(e.message)}</div>`; return; }
    this.macro = rows;
    const groups = [...new Set(rows.map(r => r.group))];
    box.innerHTML = groups.map(g => `<div class="grp-h">${esc(g)}</div><div class="grid auto" style="--min:220px">${rows.filter(r => r.group === g).map(r => this.macroTile(r)).join('')}</div>`).join('') +
      `<p class="note" style="margin-top:12px">Zdroj: FRED (Federal Reserve Bank of St. Louis), Eurostat přes FRED, ČNB. Kliknutím na dlaždici zobrazíte dlouhou historii. Barva změny respektuje, zda je růst ukazatele pro ekonomiku pozitivní.</p>`;
  },
  dateLbl(r) { if (!r.date) return ''; if (r.freq === 'm') return F.month(r.date); if (r.freq === 'q') { const d = new Date(r.date); return `Q${Math.floor(d.getUTCMonth() / 3) + 1} ${String(d.getUTCFullYear()).slice(2)}`; } return F.date(Date.parse(r.date)); },
  macroTile(r) {
    if (r.error) return `<div class="mtile"><div class="k">${esc(r.label)}</div><div class="v dim">—</div><div class="s"><span>nedostupné</span></div></div>`;
    const d = isNum(r.prev) ? r.value - r.prev : null;
    const cls = d == null || Math.abs(d) < 1e-9 ? 'fl' : r.good ? ((d > 0) === (r.good === 'up') ? 'up' : 'dn') : 'amber';
    const unit = r.unit === '%' ? ' %' : r.unit ? ' ' + r.unit : '';
    return `<div class="mtile" data-key="${esc(r.key)}" title="${esc(r.fred ? 'FRED: ' + r.fred : 'ČNB')}"><div class="k">${esc(r.label)}</div><div class="v">${F.n(r.value, r.dec)}<span class="dim" style="font-size:.8rem">${esc(unit)}</span></div>
      <div class="s"><span class="${cls}">${d == null ? '' : (d > 0 ? '▲ ' : d < 0 ? '▼ ' : '') + F.n(Math.abs(d), r.dec)}</span><span>${esc(this.dateLbl(r))}</span></div>${spark(r.spark, { w: 200, h: 30, color: '#5c87ff' })}</div>`;
  },
  async macroDetail(key) {
    const r = (this.macro || []).find(x => x.key === key);
    if (!r) return;
    const m = modal(esc(r.label), `<div class="row mb"><span class="badge blue">${esc(r.fred ? 'FRED ' + r.fred : 'ČNB')}</span><span class="note">${esc(r.tf === 'yoy' ? 'meziroční změna (y/y)' : r.tf === 'mom' ? 'meziměsíční změna (m/m)' : r.tf === 'diff' ? 'měsíční přírůstek' : 'úroveň')}</span><span class="sp"></span><div class="seg" id="md-r"><button data-v="2016-01-01">10R</button><button data-v="2005-01-01" class="active">20R</button><button data-v="1990-01-01">MAX</button></div></div><div style="height:340px" id="md-ch"></div><div id="md-tab" style="margin-top:10px"></div>`, { size: 'wide' });
    const ch = new Chart($('#md-ch', m.body), { unit: r.unit === '%' ? ' %' : '', zero: ['yoy', 'mom', 'diff'].includes(r.tf) || r.key.startsWith('t10'), monthly: r.freq === 'm' });
    m.cleanup.push(() => ch.destroy());
    const load = async from => {
      try {
        const s = await API.get(`api/macro/series?key=${encodeURIComponent(key)}&from=${from}`);
        ch.set([{ name: r.label, data: s.data.map(([d, v]) => [Date.parse(d), v]), color: '#5c87ff', area: true, step: r.key === 'cnb' || r.key === 'fed' || r.key === 'ecb' }]);
        const last = s.data.slice(-24).reverse();
        $('#md-tab', m.body).innerHTML = `<table class="t compact"><thead><tr><th>Období</th><th>Hodnota</th><th>Změna</th></tr></thead><tbody>${last.map(([d, v], i) => { const p = last[i + 1]; return `<tr><td>${esc(r.freq === 'm' ? F.month(d) : F.date(Date.parse(d)))}</td><td>${F.n(v, r.dec ?? 2)}</td><td class="${p ? F.cls(v - p[1]) : ''}">${p ? F.chg(v - p[1], r.dec ?? 2) : ''}</td></tr>`; }).join('')}</tbody></table>`;
      } catch (e) { ch.set([], { empty: 'Chyba: ' + e.message }); }
    };
    seg($('#md-r', m.body), v => load(v));
    load('2005-01-01');
  },
  renderTV() {
    const f = L().cal;
    const imp = f.imp.map(i => ({ High: '1', Medium: '0', Low: '-1' }[i])).filter(Boolean);
    const countries = [...new Set(f.cur.flatMap(c => CUR_TV[c] || []))];
    TV.mount($('#cal-tv'), 'events', { importanceFilter: (imp.length ? imp : ['-1', '0', '1']).join(','), countryFilter: (countries.length ? countries : ['us', 'eu']).join(',') });
  },
};

  search(text) { this.q = text; const i = $('#nw-q'); if (i) i.value = text; this.render(); },
  filtered(ignoreRegion) {
    const n = L().news, q = (this.q || '').toLowerCase(), tag = this.tag;
    return News.items.filter(i => (ignoreRegion || n.region === 'all' || i.region === n.region) && (!n.imp || i.score >= 4) && (!tag || (i.tags || []).includes(tag)) &&
      (!q || (i.title + ' ' + i.summary + ' ' + i.source).toLowerCase().includes(q)));
  },
  fill(id, list, opt = {}) {
    const c = $('#nw-c-' + id);
    if (!c) return;
    const st = c.scrollTop;
    c.innerHTML = list.length ? list.map(i => newsItem(i, { ...opt, since: this.since })).join('') : `<div class="empty">${News.items.length ? 'Žádné zprávy pro zvolený filtr' : 'Načítám…'}</div>`;
    c.scrollTop = st;
    const n = $('#nw-n-' + id); if (n) n.textContent = list.length;
  },
  render() {
    if (!this._init || !this.tabs) return;
    const view = this.tabs.get(), now = Date.now();
    if (view === 'topics') {
      const items = this.filtered();
      this.fill('top', items.filter(i => now - i.ts < 24 * 3600e3 && i.score >= 3).sort((a, b) => b.score - a.score || b.ts - a.ts).slice(0, 80));
      ['macro', 'markets', 'crypto'].forEach(c => this.fill(c, items.filter(i => i.cat === c).slice(0, 160)));
    } else if (view === 'regions') {
      const items = this.filtered(true);
      ['cz', 'us', 'world'].forEach(r => this.fill(r, items.filter(i => i.region === r).slice(0, 180)));
    } else this.fill('live', this.filtered().slice(0, 400), { summary: true });
    $('#nw-upd').textContent = News.updated ? `${News.items.length} zpráv · ${F.time(News.updated, true)}` : '';
    this.renderBreaking();
  },
  renderBreaking() {
    const now = Date.now();
    let list = News.items.filter(i => i.score >= 6 && now - i.ts < 3 * 3600e3);
    if (list.length < 3) list = News.items.filter(i => now - i.ts < 12 * 3600e3).sort((a, b) => b.score - a.score).slice(0, 10);
    list = list.slice(0, 15);
    const key = list.map(i => i.id).join();
    if (key === this._brKey) return;
    this._brKey = key;
    const h = list.map(i => `<span class="br-i"><b>${F.time(i.ts)} ${esc(i.source)}</b><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a></span>`).join('');
    const tr = $('#nw-br');
    tr.innerHTML = h ? h + h : '<span class="br-i dim">Žádné bleskové zprávy</span>';
    requestAnimationFrame(() => tr.style.setProperty('--br-dur', Math.max(30, tr.scrollWidth / 2 / 55) + 's'));
  },
};

function hbars(rows, key, range) {
  const max = range || Math.max(1, ...rows.map(r => Math.abs(r[key] || 0)));

}

    dd.classList.toggle('open', all.length > 0 && document.activeElement === input);
  }, 220);

function downloadFile(name, content, type = 'text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name;
  document.body.appendChild(a); a.click();

}
const csvCell = v => { const s = String(v ?? ''); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function parseCSV(txt) {
  const rows = [], sep = (txt.split('\n')[0].match(/;/g) || []).length > (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (q) { if (ch === '"' && txt[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(c => c.trim())) rows.push(row); row = []; }
    else cur += ch;
  }
  row.push(cur); if (row.some(c => c.trim())) rows.push(row);
  return rows;
}
function fxConv(v, from, to, fx) {
  if (!isNum(v)) return null;
  const r = fx && fx.rates;
  if (!r || from === to) return v;
  const a = r[from], b = r[to];
  return a && b ? v * a / b : null;
}

  async renderPositions(first) {

      const cash = p.symbol === 'CASH', q = cash ? null : Q.d[p.symbol];

      const price = cash ? 1 : q && q.price;

      const val = isNum(price) ? price * qty : null, cost = avg * qty;

      const dayB = !cash && q && isNum(q.change) ? fxConv(q.change * qty, cur, base, fx) : 0;
      return { p, q, cur, price, qty, avg, val, vB, cB, dayB, pl: vB != null && cB != null ? vB - cB : null, cls: p.cls || (cash ? 'Hotovost' : CLASS_BY_TYPE[q && q.type] || 'Ostatní') };
    });
    const tot = rows.reduce((s, r) => s + (r.vB || 0), 0), cost = rows.filter(r => r.p.symbol !== 'CASH').reduce((s, r) => s + (r.cB || 0), 0);
    const inv = rows.filter(r => r.p.symbol !== 'CASH').reduce((s, r) => s + (r.vB || 0), 0), day = rows.reduce((s, r) => s + (r.dayB || 0), 0);
    const cashV = rows.filter(r => r.p.symbol === 'CASH').reduce((s, r) => s + (r.vB || 0), 0), pl = inv - cost;
    const kpi = (k, v, s, cls = '') => `<div class="kpi"><div class="k">${k}</div><div class="v ${cls}">${v}</div><div class="s">${s || '&nbsp;'}</div></div>`;
    $('#pf-kpi').innerHTML = kpi('Hodnota portfolia', F.n(tot, 0) + ' ' + base, `${rows.length} pozic`) +

      kpi('Kurzy', fx ? `EUR ${F.n(fx.rates.EUR, 2)}` : '—', fx ? `USD ${F.n(fx.rates.USD, 2)} · ČNB ${esc(fx.date || '')}` : '');
    if (!rows.length) {

        return `<tr class="click" data-id="${esc(r.p.id)}"><td><span class="sym">${esc(cash ? 'HOTOVOST' : r.p.symbol)}</span><span class="nm">${esc(cash ? (r.p.account || r.cur) : (r.q && r.q.name) || r.p.note || '')}</span></td><td class="l tdn" style="font-size:.8rem;color:var(--muted)">${esc(r.cls)}</td><td>${F.n(r.qty, r.qty % 1 ? 4 : 0)}</td><td>${cash ? '' : F.p(r.avg)}</td><td>${cash ? '' : isNum(r.price) ? F.p(r.price) : '…'}</td><td class="${cash ? '' : F.cls(r.q && r.q.changePct)}">${cash ? '' : F.pct(r.q && r.q.changePct)}</td><td>${isNum(r.val) ? F.n(r.val, 0) + ' ' + esc(r.cur) : '—'}</td><td>${F.n(r.vB, 0)}</td><td class="${F.cls(r.pl)}">${cash ? '' : F.chg(r.pl, 0)}</td><td class="${F.cls(r.pl)}">${cash || !r.cB ? '' : F.pct(r.pl / r.cB * 100)}</td><td>${tot ? F.n((r.vB || 0) / tot * 100, 1) + ' %' : ''}</td><td class="nowrap"><button class="btn sm ghost" data-act="edit" title="Upravit">✎</button><button class="btn sm ghost danger" data-act="del" title="Smazat">✕</button></td></tr>`;

const fp = (v, d = 1) => (isNum(v) ? F.n(v * 100, d) + ' %' : '—');

    <div data-g="ds" data-p="news"><div id="ds-news" style="max-height:60vh;overflow:auto"></div></div>`, { size: 'wide' });
  const b = m.body;

    $('#ds-pf', b).onclick = () => { m.close(); go('portfolio', 'positions'); setTimeout(() => Pages.portfolio.editPosition(null, y), 80); };
    API.get('api/quotes?s=' + encodeURIComponent(y)).then(r => {
      const q = r[y];

      Q.set(y, q); paintQuotes();
      $('#ds-ex', b).textContent = [q.exchange, q.currency, q.type, q.delay ? `zpoždění ${q.delay} min` : 'bez zpoždění', q.time ? F.dt(q.time) : ''].filter(Boolean).join(' · ');
      const d = decFor(y, q.price), p = v => F.p(v, d), dist = ma => (isNum(ma) ? `${p(ma)} <span class="${F.cls(q.price - ma)}">(${F.pct((q.price / ma - 1) * 100)})</span>` : '—');
      const rows = [['Otevírací', p(q.open)], ['Denní max / min', `${p(q.high)} / ${p(q.low)}`], ['Předchozí close', p(q.prevClose)], ['Objem', F.big(q.volume, 1)], ['Průměrný objem (3M)', F.big(q.avgVolume, 1)],
        ['Tržní kapitalizace', q.marketCap ? F.big(q.marketCap) + ' ' + (q.currency || '') : '—'], ['P/E (TTM) / forward', `${F.n(q.pe, 1)} / ${F.n(q.fpe, 1)}`], ['EPS (TTM)', F.n(q.eps, 2)], ['Dividendový výnos', isNum(q.divYield) ? F.n(q.divYield, 2) + ' %' : '—'],
        ['52T rozpětí', `${p(q.low52)} – ${p(q.high52)} <span class="bar52" data-q="${esc(y)}" data-f="bar52"></span>`], ['Od 52T maxima', isNum(q.high52) ? `<span class="${F.cls(q.price - q.high52)}">${F.pct((q.price / q.high52 - 1) * 100)}</span>` : '—'],
        ['MA 50', dist(q.ma50)], ['MA 200', dist(q.ma200)], ['Pre / post market', `${q.prePrice ? p(q.prePrice) + ' (' + F.pct(q.preChangePct) + ')' : '—'} / ${q.postPrice ? p(q.postPrice) + ' (' + F.pct(q.postChangePct) + ')' : '—'}`],
        ['Příští výsledky', q.earningsTs && q.earningsTs > Date.now() - 864e5 ? F.date(q.earningsTs) : '—']];
      $('#ds-stats', b).innerHTML = rows.map(([k, v]) => `<div class="mini"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
      paintQuotes();
    }).catch(e => { $('#ds-stats', b).innerHTML = `<div class="empty">Chyba: ${esc(e.message)}</div>`; });
    mini = nativeChart($('#ds-mini', b), y, { range: '1R' });
  } else {
    $('#ds-stats', b).innerHTML = '<div class="note">Instrument je dostupný jen jako TradingView symbol – použijte záložky Graf a TradingView analýza.</div>';
  }
  return m;
}

function applySettings() {
  const s = S();
  F.setLocale(s.locale, s.timezone);
  document.body.classList.toggle('lite', !!s.lite);

function toggleLite() { S().lite = !S().lite; Store.set('settings'); applySettings(); toast(S().lite ? 'Lite mode zapnut – úsporný režim pro RPi kiosk' : 'Lite mode vypnut', 'info', { ms: 3000 }); }
function toggleFull() { if (!document.fullscreenElement) (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(() => {}); else document.exitFullscreen && document.exitFullscreen(); }
function refreshAll() {
  Object.keys(Data._c).forEach(k => Data.drop(k));
  Q.poll(); News.load(true);
  const p = Pages[App.page]; if (p && p.show) p.show();
  toast('Data obnovena', 'ok', { ms: 2000 });
}
let evLast = null;
async function pollEvents() {
  let r = await API.get('api/events?since=' + (evLast === null ? -1 : evLast), 10000);
  if (evLast === null) { evLast = r.last; return; }
  if (r.last < evLast) r = await API.get('api/events?since=0', 10000); // server restarted → sequence reset
  evLast = r.last;
  for (const e of r.events) {
    if (e.type === 'alert') {
      toast(`<b>${esc(e.title)}</b><br>${esc(e.message)}`, 'alert', { sticky: true });
      if (S().sound) beep('alert');
      desktopNotify(e.title, e.message);
      Store.refresh('alerts').then(() => { if (App.page === 'portfolio' && Pages.portfolio.view === 'alerts') Pages.portfolio.renderAlerts(); });
    } else if (e.type === 'news') {
      if (S().breakingToast) toast(`<b class="dn">BREAKING</b> ${e.link ? `<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : esc(e.title)}`, 'news', { ms: 15000 });
      if (S().newsSound) beep('news');
      desktopNotify('Breaking: ' + e.title.slice(0, 80), e.message || '', e.link);
      News.load(true);
    }
  }
}
async function pollStatus() {
  try {
    const st = await API.get('api/status', 8000);
    if (!Store.server) { location.reload(); return; }
    setSrc('server', true);
    $('#sb-ver').textContent = 'FinTerm ' + st.version;
    const sv = st.sources || {};
    if (sv.fred) setSrc('macro', sv.fred.status === 'ok', sv.fred.err);
    if (sv.ff) setSrc('cal', sv.ff.status === 'ok', sv.ff.err);
    if (sv.news) setSrc('news', sv.news.status === 'ok', sv.news.err);
  } catch (e) { if (Store.server) setSrc('server', false, e.message); }
}
function clock() {
  const now = Date.now();
  $('#sb-clock').textContent = `${F.dshort(now)} ${F.time(now, true)}`;
}

(async function boot() {
  buildNav();
  await Store.load();
  const qp = new URLSearchParams(location.search);
  if (qp.has('lite')) S().lite = qp.get('lite') !== '0';
  if (qp.has('rotate')) S().rotate = +qp.get('rotate') || 0;
  applySettings();
  setSrc('server', Store.server, Store.server ? '' : 'nedostupný');
  if (!Store.server) { setSrc('quotes', false, 'vyžaduje server'); setSrc('news', false, 'vyžaduje server'); }
  Cmd.init();
  Tape.build();
  Live.init();
  renderSessionsHeader();
  Timers.add('quotes', () => (S().quoteInterval || 15) * 1000 * (S().lite ? 2 : 1), () => Q.poll());
  Timers.add('news', () => (S().newsInterval || 120) * 1000, () => News.load(true), () => ['news', 'market'].includes(App.page));
  Timers.add('events', 15e3, pollEvents, () => Store.server);
  Timers.add('status', 60e3, pollStatus);
  Timers.add('sess', 30e3, renderSessionsHeader);
  let lastRot = Date.now();
  Timers.add('rotate', 5e3, () => {
    const s = S();
    if (!s.rotate || $$('#modal-root .ov').length || document.activeElement === $('#cmd')) return;
    if (Date.now() - App.lastInput < Math.max(30e3, s.rotate * 1000) || Date.now() - lastRot < s.rotate * 1000) return;
    const pages = (s.rotatePages || []).filter(p => Pages[p]);
    if (!pages.length) return;
    lastRot = Date.now();
    go(pages[(pages.indexOf(App.page) + 1) % pages.length]);
  });
  setInterval(() => Timers.tick(), 1000);
  setInterval(clock, 1000); clock();
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', debounce(() => Tape.speed(), 300));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Q.poll(); });
  ['pointerdown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { App.lastInput = Date.now(); }, { passive: true }));
  $('#brand').onclick = () => go('market');
  $('#btn-help').onclick = openHelp;
  $('#btn-lite').onclick = toggleLite;
  $('#btn-full').onclick = toggleFull;
  $('#btn-settings').onclick = () => openSettings();
  $('#tape').addEventListener('click', e => { const t = e.target.closest('.ti'); if (t) showChart(resolveSym(t.dataset.k)); });
  document.addEventListener('keydown', e => {
    App.lastInput = Date.now();
    if (e.key === 'Escape' && closeTopModal()) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#cmd').focus(); return; }
    const t = e.target, typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName) || t.isContentEditable;
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); $('#cmd').focus(); }
    else if (/^[1-8]$/.test(e.key) && !$$('#modal-root .ov').length) go(NAV[+e.key - 1][0]);
    else if (e.key === '?') openHelp();
    else if (e.key === ',') openSettings();
    else if (/^[a-zA-Z]$/.test(e.key) && !$$('#modal-root .ov').length) $('#cmd').focus();
  });
  route();
  pollStatus();
  if (!Store.server) toast('<b>Server FinTerm není dostupný.</b><br>Běží omezený režim (TradingView widgety + krypto WebSocket, data jen v prohlížeči). Spusťte server: <code>node server.js</code>', 'warn', { sticky: true });
  else if (!Store.writable) toast('Server nemůže zapisovat do datového adresáře – změny se neuloží trvale.', 'err', { sticky: true });
})();
</script>
</body>
