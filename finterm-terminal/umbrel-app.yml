name: FinTerm
version: "1.5.0"
tagline: Bloomberg-style finanční terminál – trhy, kalendář, zprávy, krypto, portfolio
icon: https://raw.githubusercontent.com/davidfreitagdev-oss/finterm-umbrel/main/finterm-terminal/app/public/icon.svg
description: >-
  FinTerm je self-hosted finanční terminál inspirovaný Bloombergem a Refinitivem.


  • Přehled trhů: TradingView graf s vyhledáváním libovolného aktiva, multi-chart 2×2,
  watchlisty (akcie & indexy, komodity, krypto, sazby & měny), market pulse, světové burzy.

  • Ekonomický kalendář: nadcházející události s odpočtem, historie forecast vs. actual,
  centrální banky (FED, ECB, ČNB, BoE, BoJ), makro dashboard z FRED a ČNB.

  • Zprávy: 65+ RSS zdrojů rozdělených na Česko / USA / Svět a témata
  (makro & geopolitika, trhy & earnings, krypto & regulace), breaking news.

  • Analýza: heatmapy akcií a krypta, síla měn, sektory, korelace, výnosová křivka, screener.

  • Krypto: real-time ceny přes WebSocket, top 100, Bitcoin síť (mempool, poplatky, halving).

  • Portfolio v CZK/EUR/USD, watchlist, cenové alerty 24/7 s push notifikacemi
  (ntfy, Telegram, webhook), obchodní deník a rozcestník Umbrel aplikací.


  Žádné API klíče nejsou potřeba. Data jsou uložena lokálně na vašem Umbrelu.
releaseNotes: >-
  Najdete libovolný instrument: stránka Akcie, příkazová řádka, alerty, transakce, watchlist i nástroje převedou
  holý ticker (G1A, 7203, SAP), název firmy (Siemens, Toyota, Komerční) i symbol s burzou na správnou kotaci,
  přednostně na domácí burze. U různých firem se stejným tickerem (ALV, MC) nabídnou výběr s burzou a měnou.
  Alerty a transakce se uloží jen s nalezeným instrumentem a měnou z kotace; staré záznamy typu BTC nebo CEZ v USD
  se označí a nabídnou opravu s potvrzením. Import z Ghostfolia rozpozná krypto, CoinGecko i ručně zadaná aktiva.
  Opravené grafy TradingView (Korea, Tchaj-wan, severské burzy, indexy), index PX jako graf. Valuace akcií mimo
  USA: volné cash flow po úrocích a leasingu, měna výkazů podle položek (Vale), kontrola EPS a dividend z Yahoo
  proti výkazům a skutečným výplatám, odhad růstu jako medián odhadů zisku, tržeb a historie se zobrazením složek,
  terminální růst podle inflačního cíle měny, Graham s místním výnosem (nejméně 4,4 %), konkurence bez jiných
  kotací téže firmy. Bezpečnost: při změně serveru RPC, ntfy nebo Ghostfolia se uložené heslo zahodí, vlastní RSS
  se načítají jen z ověřených veřejných adres, zápisy přijímají jen JSON.
