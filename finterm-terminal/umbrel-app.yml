name: FinTerm
version: "1.4.0"
tagline: Bloomberg-style finanční terminál – trhy, kalendář, zprávy, krypto, portfolio
icon: https://raw.githubusercontent.com/davidfreitagdev-oss/finterm-umbrel/main/finterm-terminal/app/public/icon.svg
description: >-
  FinTerm je self-hosted finanční terminál inspirovaný Bloombergem a Refinitivem.


  • Přehled trhů: TradingView graf s vyhledáváním libovolného aktiva, multi-chart 2×2,
  watchlisty (akcie & indexy, komodity, krypto, sazby & měny), market pulse, světové burzy.

  • Ekonomický kalendář: nadcházející události s odpočtem, historie forecast vs. actual,
  centrální banky (FED, ECB, ČNB, BoE, BoJ), makro dashboard z FRED a ČNB.

  • Zprávy: 65+ RSS zdrojů rozdělených na Česko / USA / Svět a témata
  (makro & geopolitika, trhy & earnings, krypto & regulace), breaking news.

  • Analýza: heatmapy akcií a krypta, síla měn, sektory, korelace, výnosová křivka, screener.

  • Krypto: real-time ceny přes WebSocket, top 100, Bitcoin síť (mempool, poplatky, halving).

  • Portfolio v CZK/EUR/USD, watchlist, cenové alerty 24/7 s push notifikacemi
  (ntfy, Telegram, webhook), obchodní deník a rozcestník Umbrel aplikací.


  Žádné API klíče nejsou potřeba. Data jsou uložena lokálně na vašem Umbrelu.
releaseNotes: >-
  Opravy čísel ve valuaci a portfoliu: akcie kotované v pencích a centech (Londýn, Johannesburg, Tel Aviv) se
  oceňují v hlavní měně, férová cena už nevychází stokrát vyšší. Když Yahoo neuvádí investice (ČEZ), použije se
  odhad volného CF z Yahoo, jinak se DCF nepočítá. Při výpadku kurzů se nic nepřepočítává 1 : 1 – použije se
  poslední uložený kurz s datem, bez něj se pozice označí a nezapočtou. Srovnání s indexem používá historický kurz.
  Bezriziková sazba i pro DKK, SEK, NOK, HUF, ZAR, ILS, INR, AUD, CAD, NZD, KRW, MXN a CLP, terminální růst nejvýš
  do výše sazby, diskont nejméně o 4 p.b. nad sazbou. U bank a pojišťoven se nepočítá zadlužení, EV, FCF ani skóre
  Zdraví. Dluh, hotovost a vlastní kapitál z jedné čtvrtletní rozvahy, výplatní poměr = dividenda / EPS. Konkurence
  jen ze stejného sektoru a stejný verdikt na stránce Akcie i v portfoliu. Transakce před splitem se přepočítají.
  Závazky (půjčky) jsou mimo výkonnost, nově čisté jmění.
